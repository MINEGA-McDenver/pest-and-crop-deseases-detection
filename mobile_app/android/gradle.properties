org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8

# Kotlin daemon stability settings for Windows release builds.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.useFallback=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# Keep daemon and workers conservative to reduce contention on Windows.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true